<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>Maică-ta Clicker</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<main class="app">
			<header class="hud">
				<div class="hud__stats">
					<div class="stat">
						<span class="stat__label">Mame</span>
						<span
							class="stat__value"
							id="mame-value"
							>0</span
						>
					</div>
					<div class="stat">
						<span class="stat__label">per second</span>
						<span
							class="stat__value"
							id="mps-value"
							>0</span
						>
					</div>
					<div class="stat">
						<span class="stat__label">kg</span>
						<span
							class="stat__value"
							id="kg-value"
							>0</span
						>
					</div>
				</div>
				<div class="menu-wrap">
					<button
						id="menu-button"
						class="menu-button"
						type="button"
						aria-label="Menu"
						aria-haspopup="menu"
						aria-expanded="false"
					>
						<span aria-hidden="true">⚙️</span>
					</button>
					<div
						id="menu"
						class="menu"
						hidden
					>
						<button
							id="reset-game"
							class="menu__item menu__item--danger"
							type="button"
						>
							Reset game
						</button>
						<button
							id="dev-menu"
							class="menu__item"
							type="button"
							hidden
						>
							Dev tools
						</button>
					</div>
				</div>
			</header>

			<section
				class="click-zone"
				id="click-zone"
				aria-label="Click maică-ta"
			>
				<div class="mom-wrap">
					<div
						class="mom-stack"
						id="mom-stack"
					>
						<button
							class="mom"
							id="mom"
							type="button"
							aria-label="Maică-ta"
						>
							<span
								class="mom__emoji"
								id="mom-emoji"
								>🧓</span
							>
						</button>
					</div>
					<p
						class="stage-label"
						id="stage-label"
					>
						Regular mom
					</p>
					<p
						class="stage-bonus"
						id="stage-bonus"
					>
						+0% MAME / click
					</p>
				</div>

				<div
					class="buildings-total"
					id="buildings-total"
					title="Buildings owned"
					hidden
				></div>
			</section>

			<aside
				class="panel is-collapsed"
				id="panel"
			>
				<button
					class="panel-toggle"
					id="panel-toggle"
					type="button"
					aria-expanded="false"
					aria-controls="panel-body"
				>
					<span class="panel-toggle__label"
						>Buildings &amp; Upgrades</span
					>
					<svg
						class="panel-toggle__caret"
						viewBox="0 0 24 24"
						aria-hidden="true"
					>
						<path
							d="M6 9l6 6 6-6"
							fill="none"
							stroke="currentColor"
							stroke-width="2.5"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</svg>
				</button>
				<div
					class="panel-body"
					id="panel-body"
				>
					<nav
						class="tabs"
						role="tablist"
						aria-label="Categories"
					>
						<button
							class="tab is-active"
							type="button"
							role="tab"
							data-tab="buildings"
						>
							Buildings
						</button>
						<button
							class="tab"
							type="button"
							role="tab"
							data-tab="upgrades"
						>
							Upgrades
						</button>
						<button
							class="tab"
							type="button"
							role="tab"
							data-tab="achievements"
						>
							Achievements
						</button>
					</nav>
					<div
						class="tab-panel is-active"
						data-panel="buildings"
					>
						<div
							class="building-list"
							id="building-list"
						></div>
					</div>
					<div
						class="tab-panel"
						data-panel="upgrades"
					>
						<p class="empty">Coming soon…</p>
					</div>
					<div
						class="tab-panel"
						data-panel="achievements"
					>
						<p class="empty">Coming soon…</p>
					</div>
				</div>
			</aside>
		</main>

		<div
			class="modal"
			id="reset-modal"
			hidden
		>
			<div
				class="modal__dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="reset-modal-title"
			>
				<h2
					class="modal__title"
					id="reset-modal-title"
				>
					Reset game?
				</h2>
				<p class="modal__text">
					This wipes all your progress. Maică-ta won't forgive
					you.
				</p>
				<div class="modal__actions">
					<button
						id="reset-yes"
						class="modal__btn modal__btn--danger"
						type="button"
					>
						Reset
					</button>
					<button
						id="reset-no"
						class="modal__btn"
						type="button"
					>
						Cancel
					</button>
				</div>
			</div>
		</div>

		<div
			class="modal"
			id="dev-modal"
			hidden
		>
			<div
				class="modal__dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="dev-modal-title"
			>
				<h2
					class="modal__title"
					id="dev-modal-title"
				>
					Edit game state
				</h2>
				<div
					class="dev-fields"
					id="dev-fields"
				></div>
				<div class="modal__actions">
					<button
						id="dev-apply"
						class="modal__btn"
						type="button"
					>
						Apply
					</button>
					<button
						id="dev-close"
						class="modal__btn"
						type="button"
					>
						Close
					</button>
				</div>
			</div>
		</div>

		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
