<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>Maică-ta Clicker</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<main class="app">
			<header class="hud">
				<div class="stat">
					<span class="stat__label">Mame</span>
					<span
						class="stat__value"
						id="mame-value"
						>0</span
					>
				</div>
				<div class="stat">
					<span class="stat__label">per second</span>
					<span
						class="stat__value"
						id="mps-value"
						>0</span
					>
				</div>
				<div class="stat">
					<span class="stat__label">kg</span>
					<span
						class="stat__value"
						id="kg-value"
						>0</span
					>
				</div>
				<div class="menu-wrap">
					<button
						id="menu-button"
						class="menu-button"
						type="button"
						aria-label="Menu"
						aria-haspopup="menu"
						aria-expanded="false"
					>
						<span aria-hidden="true">⚙️</span>
					</button>
					<div
						id="menu"
						class="menu"
						hidden
					>
						<button
							id="reset-game"
							class="menu__item menu__item--danger"
							type="button"
						>
							Reset game
						</button>
						<div
							id="reset-confirm"
							class="menu__confirm"
							hidden
						>
							<p class="menu__confirm-text">
								Reset all progress?
							</p>
							<div class="menu__confirm-actions">
								<button
									id="reset-yes"
									class="menu__confirm-btn menu__confirm-btn--danger"
									type="button"
								>
									Reset
								</button>
								<button
									id="reset-no"
									class="menu__confirm-btn"
									type="button"
								>
									Cancel
								</button>
							</div>
						</div>
					</div>
				</div>
			</header>

			<section
				class="click-zone"
				id="click-zone"
				aria-label="Click maică-ta"
			>
				<div class="mom-wrap">
					<button
						class="mom"
						id="mom"
						type="button"
						aria-label="Maică-ta"
					>
						<span
							class="mom__emoji"
							id="mom-emoji"
							>🧓</span
						>
					</button>
					<p
						class="stage-label"
						id="stage-label"
					>
						Regular mom
					</p>
					<p
						class="stage-bonus"
						id="stage-bonus"
					>
						+0% MAME / click
					</p>
				</div>

				<div
					class="buildings-total"
					id="buildings-total"
					title="Buildings owned"
					hidden
				></div>
			</section>

			<aside class="panel">
				<nav
					class="tabs"
					role="tablist"
					aria-label="Categories"
				>
					<button
						class="tab is-active"
						type="button"
						role="tab"
						data-tab="buildings"
					>
						Buildings
					</button>
					<button
						class="tab"
						type="button"
						role="tab"
						data-tab="upgrades"
					>
						Upgrades
					</button>
					<button
						class="tab"
						type="button"
						role="tab"
						data-tab="achievements"
					>
						Achievements
					</button>
				</nav>
				<div
					class="tab-panel is-active"
					data-panel="buildings"
				>
					<div
						class="building-list"
						id="building-list"
					></div>
				</div>
				<div
					class="tab-panel"
					data-panel="upgrades"
				>
					<p class="empty">Coming soon…</p>
				</div>
				<div
					class="tab-panel"
					data-panel="achievements"
				>
					<p class="empty">Coming soon…</p>
				</div>
			</aside>
		</main>

		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
