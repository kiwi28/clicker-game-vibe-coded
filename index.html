<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>Maică-ta Clicker</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			/*
			 * Critical boot-screen styles. Inlined in the <head> so the loading
			 * screen paints instantly on refresh, before the JS-bundled CSS
			 * arrives. This removes the unstyled "HTML-only" flash.
			 */
			html,
			body {
				margin: 0;
				padding: 0;
				background: #0c1410;
			}

			.loader {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				color: #e8f3e6;
				font-family:
					"Nunito",
					"Segoe UI",
					system-ui,
					-apple-system,
					sans-serif;
				background:
					radial-gradient(
						1100px 560px at 50% -12%,
						rgba(163, 230, 53, 0.16),
						transparent 62%
					),
					radial-gradient(
						900px 520px at 50% 112%,
						rgba(62, 207, 110, 0.14),
						transparent 62%
					),
					#0c1410;
			}

			.loader__content {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 18px;
				text-align: center;
			}

			.loader__spinner {
				position: relative;
				width: 88px;
				height: 88px;
			}

			.loader__ring {
				position: absolute;
				inset: 0;
				border-radius: 50%;
			}

			.loader__ring--outer {
				border: 4px solid transparent;
				border-top-color: #a3e635;
				border-right-color: #a3e635;
				animation: loader-spin 1s linear infinite;
			}

			.loader__ring--inner {
				inset: 10px;
				border: 4px solid transparent;
				border-bottom-color: #f5c542;
				border-left-color: #f5c542;
				animation: loader-spin 0.7s linear infinite reverse;
			}

			.loader__core {
				position: absolute;
				inset: 22px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 24px;
				animation: loader-pulse 1s ease-in-out infinite;
			}

			.loader__title {
				margin: 0;
				font-size: clamp(28px, 7vw, 44px);
				font-weight: 800;
				letter-spacing: 0.5px;
				line-height: 1.1;
				background: linear-gradient(
					90deg,
					#a3e635 0%,
					#f5c542 55%,
					#7ee2a8 100%
				);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				-webkit-text-fill-color: transparent;
				filter: drop-shadow(0 0 14px rgba(163, 230, 53, 0.35));
			}

			.loader__bar {
				position: relative;
				width: min(320px, 74vw);
				height: 22px;
				border-radius: 999px;
				background: #14201a;
				border: 2px solid #1d2e25;
				overflow: hidden;
			}

			.loader__bar-fill {
				position: absolute;
				top: 0;
				left: 0;
				bottom: 0;
				width: 0%;
				border-radius: 999px;
				background: linear-gradient(
					90deg,
					#3ecf6e 0%,
					#a3e635 55%,
					#f5c542 100%
				);
				box-shadow: 0 0 14px rgba(163, 230, 53, 0.55);
			}

			.loader__bar-text {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 12px;
				font-weight: 800;
				color: #ffffff;
				font-variant-numeric: tabular-nums;
				text-shadow:
					0 1px 2px rgba(0, 0, 0, 0.85),
					0 0 6px rgba(0, 0, 0, 0.5);
			}

			.loader__status {
				margin: 0;
				font-size: 13px;
				font-weight: 700;
				letter-spacing: 0.5px;
				text-transform: uppercase;
				color: #7fa88c;
			}

			.loader.is-done {
				opacity: 0;
				visibility: hidden;
				transition:
					opacity 0.4s ease,
					visibility 0s linear 0.4s;
			}

			@keyframes loader-spin {
				to {
					transform: rotate(360deg);
				}
			}

			@keyframes loader-pulse {
				0%,
				100% {
					transform: scale(1);
				}
				50% {
					transform: scale(1.18);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.loader__ring--outer {
					animation-duration: 2.4s;
				}
				.loader__ring--inner {
					animation-duration: 1.8s;
				}
				.loader__core {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div
			class="loader"
			id="loader"
			role="status"
			aria-label="Loading Maică-ta Clicker"
		>
			<div class="loader__content">
				<div
					class="loader__spinner"
					aria-hidden="true"
				>
					<span class="loader__ring loader__ring--outer"></span>
					<span class="loader__ring loader__ring--inner"></span>
					<span class="loader__core">🧓</span>
				</div>
				<h1 class="loader__title">Maică-ta Clicker</h1>
				<div
					class="loader__bar"
					id="loader-bar"
					role="progressbar"
					aria-valuemin="0"
					aria-valuemax="100"
					aria-valuenow="0"
					aria-valuetext="0%"
				>
					<div
						class="loader__bar-fill"
						id="loader-fill"
					></div>
					<span
						class="loader__bar-text"
						id="loader-percent"
						>0%</span
					>
				</div>
				<p class="loader__status">compiling moms....</p>
			</div>
		</div>

		<main class="app">
			<header class="hud">
				<div class="hud__stats">
					<div class="stat">
						<span class="stat__label">MAME</span>
						<span
							class="stat__value"
							id="MAME-value"
							>0</span
						>
					</div>
					<div class="stat">
						<span class="stat__label">per second</span>
						<span
							class="stat__value"
							id="mps-value"
							>0</span
						>
					</div>
					<div class="stat">
						<span class="stat__label">kg</span>
						<span
							class="stat__value"
							id="kg-value"
							>0</span
						>
					</div>
				</div>
				<div class="menu-wrap">
					<div
						class="player"
						id="player"
						aria-label="Music player"
					>
						<div class="player__buttons">
							<button
								id="player-prev"
								class="player__btn player__btn--reveal"
								type="button"
								aria-label="Previous track"
							></button>
							<button
								id="player-play"
								class="player__btn player__btn--reveal"
								type="button"
								aria-label="Play"
							></button>
							<button
								id="player-next"
								class="player__btn player__btn--next"
								type="button"
								aria-label="Next track"
							></button>
						</div>
						<div class="player__info">
							<span
								class="player__marquee"
								id="player-marquee"
								aria-hidden="true"
							>
								<span
									class="player__marquee-track"
									id="player-marquee-track"
								></span>
							</span>
							<span
								class="player__time"
								id="player-time"
								>0:00 / 0:00</span
							>
						</div>
					</div>
					<button
						id="menu-button"
						class="menu-button"
						type="button"
						aria-label="Menu"
						aria-haspopup="menu"
						aria-expanded="false"
					>
						<span aria-hidden="true">⚙️</span>
					</button>
					<div
						id="menu"
						class="menu"
						hidden
					>
						<button
							id="reset-game"
							class="menu__item menu__item--danger"
							type="button"
						>
							Reset game
						</button>
						<label class="menu__item menu__item--toggle">
							<span class="menu__toggle-label">Sound</span>
							<input
								type="checkbox"
								id="sound-toggle"
								checked
							/>
						</label>
						<label class="menu__item menu__item--volume">
							<span class="menu__toggle-label">Music</span>
							<input
								type="range"
								id="music-volume"
								min="0"
								max="1"
								step="0.01"
								value="0.5"
							/>
						</label>
						<label class="menu__item menu__item--volume">
							<span class="menu__toggle-label">Clicks</span>
							<input
								type="range"
								id="click-volume"
								min="0"
								max="1"
								step="0.01"
								value="0.5"
							/>
						</label>
						<label class="menu__item menu__item--toggle">
							<span class="menu__toggle-label">Dev menu</span>
							<input
								type="checkbox"
								id="dev-menu-toggle"
							/>
						</label>
						<button
							id="dev-menu"
							class="menu__item"
							type="button"
							hidden
						>
							Dev tools
						</button>
					</div>
				</div>
			</header>

			<section
				class="click-zone"
				id="click-zone"
				aria-label="Click maică-ta"
			>
				<div
					class="click-zone__moms"
					id="click-zone-moms"
				>
					<div
						class="mom-stack"
						id="mom-stack"
					>
						<div
							class="mom-cluster"
							id="mom-cluster"
						>
							<button
								class="mom"
								id="mom"
								type="button"
								aria-label="Maică-ta"
							>
								<span
									class="mom__emoji"
									id="mom-emoji"
									>🧓</span
								>
							</button>
						</div>
					</div>
				</div>

				<div class="click-zone__stats">
					<div class="stage-info">
						<p
							class="stage-label"
							id="stage-label"
						>
							Regular mom
						</p>
						<p
							class="stage-bonus"
							id="stage-bonus"
						>
							+0% MAME / click
						</p>
					</div>
				</div>

				<div class="click-zone__buildings">
					<div
						class="buildings-total"
						id="buildings-total"
						title="Buildings owned"
						hidden
					></div>
				</div>
			</section>

			<aside
				class="panel is-collapsed"
				id="panel"
			>
				<div class="panel-header">
					<button
						class="panel-toggle"
						id="panel-toggle"
						type="button"
						aria-expanded="false"
						aria-controls="panel-body"
					>
						<span class="panel-toggle__label">Buildings &amp; Upgrades</span>
						<svg
							class="panel-toggle__caret"
							viewBox="0 0 24 24"
							aria-hidden="true"
						>
							<path
								d="M6 9l6 6 6-6"
								fill="none"
								stroke="currentColor"
								stroke-width="2.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
					<button
						class="achievements-button"
						id="achievements-button"
						type="button"
						aria-haspopup="dialog"
					>
						<span
							class="achievements-button__icon"
							aria-hidden="true"
							>🏆</span
						>
						<span>Achievements</span>
					</button>
				</div>
				<div
					class="panel-body"
					id="panel-body"
				>
					<nav
						class="tabs"
						role="tablist"
						aria-label="Categories"
					>
						<button
							class="tab is-active"
							type="button"
							role="tab"
							data-tab="buildings"
						>
							<span
								class="tab__icon"
								aria-hidden="true"
								>🏠</span
							>
							<span class="tab__text">
								<span class="tab__label">Buildings</span>
								<span class="tab__desc">passive income</span>
							</span>
						</button>
						<button
							class="tab"
							type="button"
							role="tab"
							data-tab="upgrades"
						>
							<span
								class="tab__icon"
								aria-hidden="true"
								>👆</span
							>
							<span class="tab__text">
								<span class="tab__label">Upgrades</span>
								<span class="tab__desc">active income</span>
							</span>
						</button>
						<button
							class="tab"
							type="button"
							role="tab"
							data-tab="tools"
						>
							<span
								class="tab__icon"
								aria-hidden="true"
								>🔧</span
							>
							<span>Tools</span>
						</button>
					</nav>
					<div
						class="tab-panel is-active"
						data-panel="buildings"
					>
						<div
							class="building-list"
							id="building-list"
						></div>
					</div>
					<div
						class="tab-panel"
						data-panel="upgrades"
					>
						<div
							class="upgrade-list"
							id="upgrade-list"
						></div>
					</div>
					<div
						class="tab-panel"
						data-panel="tools"
					>
						<p class="empty">Coming soon</p>
					</div>
				</div>
			</aside>
		</main>

		<div
			class="modal"
			id="reset-modal"
			hidden
		>
			<div
				class="modal__dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="reset-modal-title"
			>
				<h2
					class="modal__title"
					id="reset-modal-title"
				>
					Reset game?
				</h2>
				<p class="modal__text">
					This wipes all your progress. Maică-ta won't forgive you.
				</p>
				<div class="modal__actions">
					<button
						id="reset-yes"
						class="modal__btn modal__btn--danger"
						type="button"
					>
						Reset
					</button>
					<button
						id="reset-no"
						class="modal__btn"
						type="button"
					>
						Cancel
					</button>
				</div>
			</div>
		</div>

		<div
			class="modal"
			id="dev-modal"
			hidden
		>
			<div
				class="modal__dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="dev-modal-title"
			>
				<h2
					class="modal__title"
					id="dev-modal-title"
				>
					Edit game state
				</h2>
				<div
					class="dev-fields"
					id="dev-fields"
				></div>
				<label class="dev-toggle">
					<input
						type="checkbox"
						id="dev-disable-loader"
					/>
					<span class="dev-toggle__label">Disable loading screen</span>
				</label>
				<p class="dev-toggle__hint">Applies on next reload.</p>
				<div class="modal__actions">
					<button
						id="dev-apply"
						class="modal__btn"
						type="button"
					>
						Apply
					</button>
					<button
						id="dev-close"
						class="modal__btn"
						type="button"
					>
						Close
					</button>
				</div>
			</div>
		</div>

		<div
			class="modal"
			id="achievements-modal"
			hidden
		>
			<div
				class="modal__dialog modal__dialog--wide"
				role="dialog"
				aria-modal="true"
				aria-labelledby="achievements-modal-title"
			>
				<h2
					class="modal__title"
					id="achievements-modal-title"
				>
					Achievements
				</h2>
				<div
					class="achievement-list"
					id="achievement-list"
				></div>
				<div class="modal__actions">
					<button
						id="achievements-close"
						class="modal__btn"
						type="button"
					>
						Close
					</button>
				</div>
			</div>
		</div>

		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
